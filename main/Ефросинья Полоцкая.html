<body>
    <header class="block">
        <div class="header_cont">
            <a href="./main.html">
                <img src ="../sources/logo.jpg" class="img_logo">
            </a>
            <div class = "menu_cont">
                <a href="" id="main_txt">Ефросинья Полоцкая</a>

            </div>
        </div>
    </header>

    <main class="block">
        <div class="slider-container">
    <div class="slider-track" id="track">
        <div class="slide" style="background-image: url('');">
            <div class="slide-content">
            </div>
        </div>
        <div class="slide" style="background-image: url('');">
            <div class="slide-content">
            </div>
        </div>
        <div class="slide" style="background-image: url('');">
            <div class="slide-content">
            </div>
        </div>
    </div>

    <button class="nav-btn prev" onclick="moveSlide(-1)">&#10094;</button>
    <button class="nav-btn next" onclick="moveSlide(1)">&#10095;</button>
</div>

<script>
    const track = document.getElementById('track');
    const slides = document.querySelectorAll('.slide');
    const dotsContainer = document.getElementById('dotsContainer');
    let currentIndex = 0;

    slides.forEach((_, i) => {
        const dot = document.createElement('span');
        dot.classList.add('dot');
        if (i === 0) dot.classList.add('active');
        dot.addEventListener('click', () => goToSlide(i));
        dotsContainer.appendChild(dot);
    });

    const dots = document.querySelectorAll('.dot');

    function updateDots() {
        dots.forEach((dot, i) => {
            dot.classList.toggle('active', i === currentIndex);
        });
    }

    function moveSlide(direction) {
        currentIndex = (currentIndex + direction + slides.length) % slides.length;
        updateSlider();
    }

    function goToSlide(index) {
        currentIndex = index;
        updateSlider();
    }

    function updateSlider() {
        track.style.transform = `translateX(-${currentIndex * 100}%)`;
        updateDots();
    }
</script>
    </main>

    <footer class="block"></footer>
</body>
</html>
